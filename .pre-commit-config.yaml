repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [ python ]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [ python ]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [ python ]
        pass_filenames: true
