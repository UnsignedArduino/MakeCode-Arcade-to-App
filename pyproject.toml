[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkcd2app"
version = "0.1.0"
description = "Convert MakeCode Arcade games into static websites, Electron, or Tauri apps"
readme = "README.md"
requires-python = ">=3.14"
# We are pinning redun because we monkey patch something
dependencies = [
    "pydantic",
    "pyyaml",
    "redun==0.44.1",
    "requests",
    "beautifulsoup4",
    "pillow",
    "platformdirs>=4.11.0",
    "dulwich>=1.2.20",
]

[project.scripts]
mkcd2app = "mkcd2app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mkcd2app"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is on by default; pass --no-cov to turn it off (e.g. when debugging)
addopts = ["--strict-markers", "--cov", "--cov-report=term-missing"]
filterwarnings = ["error"]
# Applied by directory in tests/conftest.py, so tests don't need to mark themselves
markers = [
    "unit: fast, offline tests under tests/unit",
    "integration: fast, offline tests under tests/integration that run the real redun scheduler with fake commands",
    "e2e: slow tests under tests/e2e that install the toolchain and build real games",
    "network: also needs a public game or service; skipped unless --run-network is passed",
]

[tool.coverage.run]
source = ["mkcd2app"]
