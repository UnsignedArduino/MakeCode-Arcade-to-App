# E2E config that builds the empty game from a PNG downloaded from the editor
# (a `file` code source)

# Config version (single number, incremented if breaking change to schema is
# made)
version: 1

project:
  name: Empty Game
  path_friendly_name: empty-game
  description: "Empty game, exported as a PNG from the 4.0.14 editor, used for E2E testing"
  author: Cyrus Yiu
  version: 0.0.1
  # This is what the window title will be
  # This will also be used for the executable file name for Electron outputs
  # You can use {NAME} or {VERSION} or {AUTHOR} to substitute the correct
  # values
  title: "{NAME} v{VERSION}"

inputs:
  # Can be share_link, git, path, or file (a PNG or UF2 downloaded from the
  # editor, or a ZIP of the project such as GitHub's "Download ZIP"). github is
  # an older alias for git.
  code:
    type: file
    value: "embedded/empty-game.png"

  assets: {}
    # Icon is optional but highly recommended, it will be used as the favicon
    # and app icon
#    icon:
#       Can be url or path
#      type: url
#      value: https://raw.githubusercontent.com/UnsignedArduino/MakeCode-Arcade-to-App/refs/heads/main/examples/Racers%20icon.png

#    icon:
#      type: path
#      value: "../../examples/Racers icon.png"

# Path where the build process will take place
# Relative paths in this file are relative to this file's directory
build_dir: "./build"

# MakeCode Arcade target version (must be installed with `mkcd2app target install`)
target: 4.0.14

# You can have multiple outputs
# Currently available options are static, static-singlefile, electron, and
# tauri
outputs:
  - type: static
  - type: static-singlefile
#  - type: electron
#    window:
#      width: 640
#      height: 480
#  - type: tauri
#    identifier: com.unsignedarduino.racers
#    window:
#      width: 640
#      height: 480
